<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail de Révisions - UMF</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        :root {
            --primary-color: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }

        .logo {
            max-height: 80px;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 1.8rem;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 1rem;
        }

        /* Grille des modules */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        /* Style des cartes */
        .module-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none; /* Enlève le soulignement du lien */
            color: var(--text-main);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border: 2px solid transparent;
        }

        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: var(--primary-color);
        }

        .module-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .module-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        <h1>Portail de Révisions</h1>
        <p class="subtitle">Sélectionne un module pour t'entraîner</p>
    </header>

    <div class="modules-grid">
        
        <a href="eia.html" class="module-card">
            <div class="module-title">Éthique (EIA)</div>
            <div class="module-desc">Grille de 102 questions - Intégrité académique et déontologie.</div>
        </a>

        <a href="anatomie.html" class="module-card">
            <div class="module-title">Anatomie</div>
            <div class="module-desc">Révisions sur les atlas Kamina et Sinelnikov.</div>
        </a>

        <a href="biophysique.html" class="module-card">
            <div class="module-title">Biophysique</div>
            <div class="module-desc">QCM et exercices d'entraînement.</div>
        </a>

        <a href="biochimie.html" class="module-card">
            <div class="module-title">Biochimie</div>
            <div class="module-desc">Métabolismes et voies biochimiques.</div>
        </a>

    </div>

</body>
</html>
